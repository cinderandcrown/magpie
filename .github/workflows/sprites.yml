# Optional workflow_dispatch (must live on default branch to appear in Actions UI).
# Prefer the one-shot CI job gated by Assets/SPRITERRIFIC_REQUEST on the mission branch.
# Secret: SPRITERRIFIC_API_KEY (never echoed).
name: Spriterrific Raccoon Sprites

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, only print plan / balance (no spend)"
        type: boolean
        default: true
      asset_ref:
        description: "Git ref that holds the raccoon reference image + scripts"
        type: string
        default: cursor/mission-1-raccoon-toy-0c7d

concurrency:
  group: spriterrific-raccoon-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.asset_ref }}
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow numpy

      - name: Generate sprites (Spriterrific)
        env:
          SPRITERRIFIC_API_KEY: ${{ secrets.SPRITERRIFIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          test -n "${SPRITERRIFIC_API_KEY:-}" || { echo "SPRITERRIFIC_API_KEY secret is missing"; exit 1; }
          python3 scripts/spriterrific_raccoon.py \
            --ref Assets/Generated/sprites/raccoon/idle.png \
            --out spriterrific-runs \
            --dry-run="$DRY_RUN"

      - name: Upload spriterrific-runs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spriterrific-raccoon
          path: spriterrific-runs/
          if-no-files-found: warn

      - name: Import + commit
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          python3 scripts/import_spriterrific_raccoon.py \
            --runs spriterrific-runs \
            --dest Assets/Generated/sprites/raccoon
          rm -f Assets/SPRITERRIFIC_REQUEST
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Generated/sprites/raccoon Assets/LICENSES.md ASSETS_LICENSES.md spriterrific-runs || true
          git add -u Assets/SPRITERRIFIC_REQUEST || true
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
          else
            git commit -m "Import Spriterrific raccoon sheets (idle/run/jump/attack)"
            git push origin HEAD:${{ inputs.asset_ref }}
          fi
