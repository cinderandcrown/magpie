jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Spend disabled
        run: |
          echo "Spriterrific CI spend is disabled."
          echo "Anchor job (Fire Fox): kh73s9m80tz14zdr7n3gp16d358jakpv"
          echo "See Assets/SPRITERRIFIC_ANCHOR.md"
          exit 0
