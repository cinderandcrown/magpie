name: CI

on:
  pull_request:
  push:
    branches: [main, "mission/**"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default read for normal CI jobs. Spriterrific job elevates to write to push sheets.
# (Job permissions may only narrow a workflow grant — so write must be allowed here.)
permissions:
  contents: write

jobs:
  # One-shot Spriterrific spend. Gate is a STEP check (hashFiles is illegal in jobs.*.if
  # and was failing the whole workflow file with zero jobs). Own concurrency group never
  # cancels an in-flight spend. Secret: SPRITERRIFIC_API_KEY (never logged).
  spriterrific:
    name: Spriterrific raccoon (credit spend)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: spriterrific-raccoon-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Gate on request flag
        id: gate
        run: |
          set -euo pipefail
          if [ -f Assets/SPRITERRIFIC_REQUEST ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Spriterrific request flag present"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Assets/SPRITERRIFIC_REQUEST — skipping spend"
          fi
      - name: Install Pillow
        if: steps.gate.outputs.run == 'true'
        run: python3 -m pip install --quiet pillow numpy
      - name: Generate (Anchor First, preserve-reference, ≤430 / abort if bal<460)
        if: steps.gate.outputs.run == 'true'
        env:
          SPRITERRIFIC_API_KEY: ${{ secrets.SPRITERRIFIC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SPRITERRIFIC_API_KEY:-}" || { echo "SPRITERRIFIC_API_KEY missing"; exit 1; }
          python3 scripts/spriterrific_raccoon.py \
            --ref Assets/Generated/sprites/raccoon/idle.png \
            --out spriterrific-runs \
            --dry-run=false
      - name: Import sheets into Assets/Generated
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 scripts/import_spriterrific_raccoon.py \
            --runs spriterrific-runs \
            --dest Assets/Generated/sprites/raccoon
          rm -f Assets/SPRITERRIFIC_REQUEST
      - name: Upload spriterrific-runs
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spriterrific-raccoon
          path: spriterrific-runs/
          if-no-files-found: warn
      - name: Commit imported sprites
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Generated/sprites/raccoon Assets/LICENSES.md ASSETS_LICENSES.md spriterrific-runs || true
          git add -u Assets/SPRITERRIFIC_REQUEST || true
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
          else
            git commit -m "Import Spriterrific raccoon sheets (idle/run/jump/attack)"
            git push
          fi

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Script unit tests
        run: python3 -m unittest discover -s scripts -v

  gamecore-linux:
    name: GameCore (Linux)
    # Pin 24.04: Swift 6.2 official tarball targets ubuntu2404; ubuntu-latest is 26.04
    # and lacks libxml2.so.2 SONAME expected by that toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Swift 6.2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2 libncurses6 libcurl4 binutils
          curl -fsSL "https://download.swift.org/swift-6.2-release/ubuntu2404/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu24.04.tar.gz" -o /tmp/swift.tgz
          sudo mkdir -p /opt/swift
          sudo tar -xzf /tmp/swift.tgz -C /opt/swift --strip-components=1
          echo /opt/swift/usr/bin >> "$GITHUB_PATH"
          arch="$(uname -m)"
          if [ ! -e "/usr/lib/${arch}-linux-gnu/libncurses.so.6" ] && [ -e "/usr/lib/${arch}-linux-gnu/libncursesw.so.6" ]; then
            sudo ln -sf libncursesw.so.6 "/usr/lib/${arch}-linux-gnu/libncurses.so.6"
          fi
      - name: swift --version
        run: swift --version
      - name: GameCore tests
        working-directory: Packages/GameCore
        run: swift test
      - name: Services tests
        working-directory: Packages/Services
        run: swift test
      - name: GameRender tests (Linux-safe symbols)
        working-directory: Packages/GameRender
        run: swift test

  build:
    name: Build and test (iPhone)
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          echo "Runner labels context: xcode-27 (standard; not xlarge)"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "ImageOS=${ImageOS:-unknown} RUNNER_NAME=${RUNNER_NAME:-unknown}"

      - name: Install XcodeGen + ffmpeg
        run: brew install xcodegen ffmpeg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Magpie.xcodeproj \
            -scheme Magpie \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
          | tee xcodebuild.log \
          | xcbeautify --renderer github-actions

      - name: Fail on Magpie warnings/errors
        if: always()
        run: |
          [ -f xcodebuild.log ] || exit 0
          root="$PWD/"
          errs=$(grep -E "^${root}(Magpie|MagpieTests|Packages)/[^:]+:[0-9]+:[0-9]+: error:" xcodebuild.log | awk '!seen[$0]++' || true)
          warns=$(grep -E "^${root}(Magpie|MagpieTests|Packages)/[^:]+:[0-9]+:[0-9]+: warning:" xcodebuild.log | awk '!seen[$0]++' || true)
          echo "Errors:"; echo "$errs"
          echo "Warnings:"; echo "$warns"
          if [ -n "$errs" ] || [ -n "$warns" ]; then exit 1; fi

      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          device="$(python3 scripts/pick_iphone_simulator.py)"
          echo "device=$device" >> "$GITHUB_OUTPUT"
          echo "Simulator: $device"
          xcodebuild test-without-building \
            -project Magpie.xcodeproj \
            -scheme Magpie \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
          | tee xcodebuild-test.log \
          | xcbeautify --renderer github-actions

      - name: Simulator smoke (gameplay video + moment screenshots)
        env:
          DEVICE: ${{ steps.tests.outputs.device }}
        run: |
          set -euo pipefail
          app="$(find DerivedData/Build/Products -name 'Magpie.app' -type d | head -1)"
          test -n "$app"
          ./scripts/simulator_smoke.sh "$DEVICE" "$app" smoke-artifacts

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild.log
            xcodebuild-test.log
            TestResults.xcresult
          if-no-files-found: ignore
