# Never commit a hand-made .xcodeproj.

name: Magpie
options:
  bundleIdPrefix: com.cinderandcrown
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: GDNRT9DJ58
    CODE_SIGN_STYLE: Automatic
    APP_CODE_SIGN_IDENTITY: Apple Development
    APP_AD_HOC_SIGNING: "NO"
    PRODUCT_BUNDLE_IDENTIFIER: com.cinderandcrown.magpie

configs:
  Debug:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  Release:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  Magpie:
    type: application
    platform: iOS
    sources:
      - path: Magpie
        excludes:
          - "**/*.plist"
          - "**/*.xcprivacy"
          - Generated
          - Generated/**
    resources:
      - path: Magpie/Assets.xcassets
      - path: Magpie/PrivacyInfo.xcprivacy
    # Do NOT add Assets/Generated as an Xcode resource group — identical basenames
    # (raccoon/idle.png vs mop/idle.png) flatten and collide in the app bundle.
    # Copy the tree into Magpie.app/Generated via script instead.
    postCompileScripts:
      - name: Copy Generated Assets into app
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/Assets/Generated"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Generated"
          mkdir -p "$DEST"
          rsync -a --delete "${SRC}/" "${DEST}/"
          test -f "${DEST}/ui/logo_b1_holo_glass.png"
          test -f "${DEST}/ui/logo_b1_holo_glass@1024.png"
          test -f "${DEST}/ui/logo_b1_holo_glass_compact.png"
          test -f "${DEST}/ui/logo_neon_city_bandit.png"
          test -f "${DEST}/ui/logo_neon_city_bandit@1024.png"
          test -f "${DEST}/ui/title_leap@1024.png"
          # Nicholas-approved B1 branding (also kept under Assets/Branding/logo/).
          BRAND_SRC="${SRCROOT}/Assets/Branding"
          BRAND_DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Branding"
          if [[ -d "$BRAND_SRC" ]]; then
            mkdir -p "$BRAND_DEST"
            rsync -a --delete "${BRAND_SRC}/" "${BRAND_DEST}/"
            test -f "${BRAND_DEST}/logo/B1_holo_glass.png"
            test -f "${BRAND_DEST}/logo/B1_holo_glass_icon.png"
            test -f "${BRAND_DEST}/logo/ncb-icon-portrait-1024.png"
            test -f "${BRAND_DEST}/logo/ncb-title-leap-1024.png"
            test -f "${BRAND_DEST}/logo/LICENSE-ncb-icon.md"
          fi
          test -f "${DEST}/audio/level_loop.m4a"
          test -f "${DEST}/sprites/spriterrific_ready/bandit/idle/01.png"
          test -f "${DEST}/sprites/spriterrific_ready/bandit/idle_front/01.png"
          test -f "${DEST}/sprites/spriterrific_ready/mop_bot/walk/01.png"
          test -f "${DEST}/sprites/spriterrific_ready/mop_9000_boss/tread_roll/01.png"
          test -f "${DEST}/sprites/spriterrific/bandit/idle/spritesheet.png"
          # Juice SFX pack (separate from Generated — identical basenames collide if flattened).
          SFX_SRC="${SRCROOT}/Assets/Audio/sfx"
          SFX_DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Audio/sfx"
          mkdir -p "$SFX_DEST"
          rsync -a --delete "${SFX_SRC}/" "${SFX_DEST}/"
          test -f "${SFX_DEST}/sfx_manifest.json"
          test -f "${SFX_DEST}/jump.wav"
          test -f "${SFX_DEST}/startup_jingle.wav"
          test -f "${SFX_DEST}/boss_tread_rumble.wav"
          MUSIC_SRC="${SRCROOT}/Assets/Audio/music"
          MUSIC_DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Audio/music"
          mkdir -p "$MUSIC_DEST"
          rsync -a --delete "${MUSIC_SRC}/" "${MUSIC_DEST}/"
          test -f "${MUSIC_DEST}/main_theme.m4a"
          test -f "${MUSIC_DEST}/menu_theme.m4a"
          test -f "${MUSIC_DEST}/boss_theme.m4a"
          # Story + optional MOP voice lines (README lists ElevenLabs filenames).
          STORY_SRC="${SRCROOT}/Assets/Story"
          STORY_DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Story"
          mkdir -p "$STORY_DEST"
          rsync -a --delete "${STORY_SRC}/" "${STORY_DEST}/"
          test -f "${STORY_DEST}/Story.json"
          VOICE_SRC="${SRCROOT}/Assets/Audio/voice"
          VOICE_DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Audio/voice"
          if [[ -d "$VOICE_SRC" ]]; then
            mkdir -p "$VOICE_DEST"
            rsync -a --delete "${VOICE_SRC}/" "${VOICE_DEST}/"
          fi
          echo "Copied Generated -> $DEST"
          echo "Copied SFX -> $SFX_DEST"
          echo "Copied music -> $MUSIC_DEST"
          echo "Copied Story -> $STORY_DEST"
    settings:
      base:
        INFOPLIST_FILE: Magpie/Info.plist
        CODE_SIGN_ENTITLEMENTS: Magpie/Magpie.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.cinderandcrown.magpie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_IDENTITY: $(APP_CODE_SIGN_IDENTITY)
        "AD_HOC_CODE_SIGNING_ALLOWED[sdk=iphoneos*]": $(APP_AD_HOC_SIGNING)
    entitlements:
      path: Magpie/Magpie.entitlements
    dependencies:
      - package: GameCore
      - package: GameRender
      - package: Services

  MagpieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MagpieTests
    dependencies:
      - target: Magpie
      - package: GameCore
      - package: GameRender
      - package: Services
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

packages:
  GameCore:
    path: Packages/GameCore
  GameRender:
    path: Packages/GameRender
  Services:
    path: Packages/Services

schemes:
  Magpie:
    build:
      targets:
        Magpie: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MagpieTests
    archive:
      config: Release
