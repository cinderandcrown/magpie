#
# Source of truth for Magpie.xcodeproj. Generate with: xcodegen generate
# Why XcodeGen (not Tuist): matches cinderandcrown/phoenix-fox; one YAML file;
# no Tuist binary/state; enough for a single iPhone SpriteKit app + local package.

name: Magpie
options:
  bundleIdPrefix: com.cinderandcrown
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: GDNRT9DJ58
    CODE_SIGN_STYLE: Automatic
    APP_CODE_SIGN_IDENTITY: Apple Development
    APP_AD_HOC_SIGNING: "NO"
    INFOPLIST_FILE: Magpie/Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.cinderandcrown.magpie

configs:
  Debug:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  Release:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  MagpieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MagpieTests
    dependencies:
      - target: Magpie
      - package: GameRules
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MAGPIE_TARGET: "YES"

  Magpie:
    type: application
    platform: iOS
    sources:
      - path: Magpie/App
    resources:
      - path: Magpie/Resources
        excludes:
          - "**/*.plist"
    settings:
      base:
        INFOPLIST_FILE: Magpie/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cinderandcrown.magpie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_IDENTITY: $(APP_CODE_SIGN_IDENTITY)
        MAGPIE_TARGET: "YES"
        "AD_HOC_CODE_SIGNING_ALLOWED[sdk=iphoneos*]": $(APP_AD_HOC_SIGNING)
    dependencies:
      - package: GameRules

packages:
  GameRules:
    path: Packages/GameRules

schemes:
  Magpie:
    build:
      targets:
        Magpie: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MagpieTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
