# Never commit a hand-made .xcodeproj.

name: Magpie
options:
  bundleIdPrefix: com.cinderandcrown
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: GDNRT9DJ58
    CODE_SIGN_STYLE: Automatic
    APP_CODE_SIGN_IDENTITY: Apple Development
    APP_AD_HOC_SIGNING: "NO"
    PRODUCT_BUNDLE_IDENTIFIER: com.cinderandcrown.magpie

configs:
  Debug:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  Release:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  Magpie:
    type: application
    platform: iOS
    sources:
      - path: Magpie
        excludes:
          - "**/*.plist"
          - "**/*.xcprivacy"
          - Generated
          - Generated/**
    resources:
      - path: Magpie/Assets.xcassets
      - path: Magpie/PrivacyInfo.xcprivacy
    # Do NOT add Assets/Generated as an Xcode resource group — identical basenames
    # (raccoon/idle.png vs mop/idle.png) flatten and collide in the app bundle.
    # Copy the tree into Magpie.app/Generated via script instead.
    postCompileScripts:
      - name: Copy Generated Assets into app
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/Assets/Generated"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Generated"
          mkdir -p "$DEST"
          rsync -a --delete "${SRC}/" "${DEST}/"
          test -f "${DEST}/ui/logo_trash_panda.png"
          test -f "${DEST}/audio/level_loop.m4a"
          echo "Copied Generated -> $DEST"
    settings:
      base:
        INFOPLIST_FILE: Magpie/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cinderandcrown.magpie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_IDENTITY: $(APP_CODE_SIGN_IDENTITY)
        "AD_HOC_CODE_SIGNING_ALLOWED[sdk=iphoneos*]": $(APP_AD_HOC_SIGNING)
    dependencies:
      - package: GameCore
      - package: GameRender
      - package: Services

  MagpieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MagpieTests
    dependencies:
      - target: Magpie
      - package: GameCore
      - package: Services
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

packages:
  GameCore:
    path: Packages/GameCore
  GameRender:
    path: Packages/GameRender
  Services:
    path: Packages/Services

schemes:
  Magpie:
    build:
      targets:
        Magpie: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MagpieTests
    archive:
      config: Release
